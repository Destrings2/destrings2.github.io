name: Deploy to Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Only one deployment at a time, and let a run in progress finish rather than
# cancelling it half-way through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # The Supabase variables live on the github-pages environment, and an
    # environment's variables reach only the jobs that name it. Without this
    # the build reads them as empty and silently produces an on-device-only
    # app — which is what shipped before the guard below was fixed.
    environment: github-pages
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      # base_path is '/<repo>' for a project site and '/' for a user or
      # custom-domain one. Vite wants exactly one trailing slash either way;
      # concatenating blindly would give '//' on a user site.
      - name: Work out the base path
        id: base
        run: |
          raw='${{ steps.pages.outputs.base_path }}'
          case "$raw" in
            ''|'/') normalised='/' ;;
            */)     normalised="$raw" ;;
            *)      normalised="$raw/" ;;
          esac
          echo "path=$normalised" >> "$GITHUB_OUTPUT"
          echo "Building for base path: $normalised"

      - name: Build
        env:
          # Not secrets. The publishable key is designed to sit in a public
          # bundle; what protects the data is row-level security and the
          # invite, not this string being hard to find. Kept in repository
          # variables so a fork builds without them and simply runs on-device.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          # '/<repo>/' for a project site, '/' for a user or custom-domain one.
          VITE_BASE_PATH: ${{ steps.base.outputs.path }}
        run: npm run build

      # Checked against THIS project's URL, not the word "supabase": the
      # client library ships a '*.supabase.co' hostname allowlist and an
      # 'sb_publishable_' prefix check of its own, so grepping for either
      # passes happily on a build that has no backend configured at all.
      - name: Fail if the backend was not configured
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Repository variables VITE_SUPABASE_URL and"
            echo "::error::VITE_SUPABASE_ANON_KEY are not set, so the deployed app"
            echo "::error::would store data on-device only, with no way to sign in."
            echo "::error::Set them under Settings > Secrets and variables >"
            echo "::error::Actions > Variables."
            exit 1
          fi
          # The host is what actually has to reach the bundle; a variable that
          # is set but not threaded through to the build fails here.
          host=$(printf '%s' "$SUPABASE_URL" | sed -E 's#^https?://##; s#/.*##')
          if ! grep -rqF "$host" dist/assets/*.js; then
            echo "::error::$host is not in the built bundle, so the app cannot"
            echo "::error::reach the backend. The build did not pick the"
            echo "::error::variables up."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
